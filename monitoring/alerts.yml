# Alert rules (visible in Prometheus > Alerts). No Alertmanager is wired up: see docs/runbook.md
# for what to do when each one fires. In production these would page / email someone.
groups:
  - name: guard
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "PostgreSQL is down", runbook: "docs/runbook.md#database-down"}
      - alert: TooManyConnections
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than 80% of max_connections in use", runbook: "docs/runbook.md#too-many-connections"}
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "A disk is more than 85% full", runbook: "docs/runbook.md#disk-full"}
      - alert: LongRunningTransaction
        expr: max(pg_stat_activity_max_tx_duration) > 600
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "A transaction has been open for more than 10 minutes"}
