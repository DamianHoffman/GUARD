apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Business dashboards read the reporting views as the least-privileged analyst role
  - name: GUARD Reporting
    type: postgres
    access: proxy
    url: postgres:5432
    user: guard_analyst
    jsonData: {database: guard, sslmode: disable, postgresVersion: 1600}
    secureJsonData: {password: "${ANALYST_PASSWORD}"}
