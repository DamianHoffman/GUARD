# Local "production-like" stack. Start with:  docker compose up -d
# Everything listens on 127.0.0.1 only (not exposed to your network).
services:
  postgres:
    image: postgres:16
    container_name: guard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ETL_PASSWORD: ${ETL_PASSWORD}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD}
      BACKUP_PASSWORD: ${BACKUP_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500      # log queries slower than 500 ms
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro     # schema, audit, views, roles (first start only)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: guard-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:5050:80"]
    depends_on:
      postgres: {condition: service_healthy}

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: guard-pg-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://guard_monitor:${MONITOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres: {condition: service_healthy}

  node-exporter:
    image: prom/node-exporter:latest
    container_name: guard-node-exporter
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: guard-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:latest
    container_name: guard-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      ANALYST_PASSWORD: ${ANALYST_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  # Read-only web console: http://localhost:8080  (talks to the database as the analyst role)
  console:
    build: .
    container_name: guard-console
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD}
      BACKUP_DIR: /app/backups
    command: ["console", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./backups:/app/backups:ro
    depends_on:
      postgres: {condition: service_healthy}

  # One-off job: docker compose run --rm etl      (profile keeps it out of `up`)
  etl:
    build: .
    profiles: ["tools"]
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      ETL_PASSWORD: ${ETL_PASSWORD}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
    command: ["load", "--inbox", "/app/data/inbox", "--processed", "/app/data/processed", "--rejected", "/app/data/rejected"]

volumes:
  pgdata:
  promdata:
  grafanadata:
